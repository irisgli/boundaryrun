[project]
name = "boundaryrun"
version = "0.1.0"
description = "Verifiable autonomous security remediation: policy-enforced agent tools, sandboxed execution, independent verification."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
boundaryrun = "boundaryrun.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boundaryrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Docker on macOS VMs only shares the home directory, so keep pytest temp dirs in the repo.
addopts = "-ra --basetemp=.runs/pytest-tmp"
markers = [
    "docker: requires a running Docker daemon and the runner image",
    "live: calls the real model API (opt in with BOUNDARYRUN_LIVE=1)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
